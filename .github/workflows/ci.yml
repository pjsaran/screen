# CI for Captr (SPEC §11): formatting check, warnings-as-errors build, tests,
# licence gate, and packaging.
#
# Signing: a DRY RUN of build/Sign-Artifacts.ps1 runs on every build (no certificate
# needed; it proves the plan and verifies the pinned FFmpeg). Real signing happens
# only when the repository's signing secrets are set - pushes to the main repository
# - and then Verify-Signatures.ps1 fails the job on any unsigned, untimestamped, or
# wrongly-signed file. Pull requests and forks build unsigned, loudly, which SPEC §11
# requires to succeed. Secret names are listed in docs/developer-guide/releasing.md.
#
# Test selection EXCLUDES what a hosted runner cannot do (a real desktop, a GPU,
# patience, the installer) rather than listing what it can; an include-list once
# silently skipped every uncategorised test. The Published category runs after
# packaging, because it drives the published captr.exe.
#
# Third-party actions are pinned to commit SHAs (a tag can be moved; a commit
# cannot), and the token is read-only.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore dotnet tools (nuget-license)
        run: dotnet tool restore

      - name: Fetch pinned FFmpeg (checksum-verified)
        run: pwsh build/fetch-ffmpeg.ps1

      - name: Licence gate (SPEC §2 — fails on disallowed or drifted report)
        run: pwsh build/check-licenses.ps1

      - name: Verify formatting
        run: dotnet format Captr.slnx --verify-no-changes

      - name: Build (warnings are errors)
        run: dotnet build Captr.slnx --configuration Release

      - name: Unit tests
        run: dotnet test tests/Captr.Core.Tests --configuration Release --no-build

      - name: Integration tests (everything a hosted runner can run)
        run: >
          dotnet test tests/Captr.Integration.Tests --configuration Release --no-build
          --filter "Category!=Published&Category!=Installer&Category!=Display&Category!=Gpu&Category!=Soak"

      - name: Package (publish + installer; signed and verified when the secrets exist)
        env:
          CAPTR_SIGN_PFX_BASE64: ${{ secrets.CAPTR_SIGN_PFX_BASE64 }}
          CAPTR_SIGN_PFX_PASSWORD: ${{ secrets.CAPTR_SIGN_PFX_PASSWORD }}
          CAPTR_SIGN_PUBLISHER: ${{ vars.CAPTR_SIGN_PUBLISHER }}
        run: pwsh build/build.ps1 -Configuration Release -SkipTests -Installer

      - name: Signing dry run (no certificate needed)
        run: pwsh build/Sign-Artifacts.ps1 -Path publish -DryRun

      # AFTER packaging on purpose: these drive publish/captr.exe, which the
      # step above is what creates. Running them earlier is what used to fail.
      - name: CLI contract tests (against the published payload)
        run: >
          dotnet test tests/Captr.Integration.Tests --configuration Release --no-build
          --filter "Category=Published"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: captr-package
          path: |
            artifacts/**
